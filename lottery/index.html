<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Lottery: odds you were never going to beat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter+Tight:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/core.js" defer></script>
    <script src="js/machines/case.js" defer></script>
    <script src="js/machines/slots.js" defer></script>
    <script src="vendor/d3-array.min.js" defer></script>
    <script src="vendor/d3-geo.min.js" defer></script>
    <script src="vendor/topojson-client.min.js" defer></script>
    <script src="vendor/countries-110m.js" defer></script>
    <script src="js/machines/birth.js" defer></script>
    <script src="js/machines/powerball.js" defer></script>
    <script src="js/machines/gacha.js" defer></script>
    <script src="js/machines/packs.js" defer></script>
    <script src="js/machines/silicon.js" defer></script>
    <script src="js/machines/jobs.js" defer></script>
</head>
<body>
    <div class="app">
        <header class="topbar">
            <div class="brand">
                <svg class="brand-mark" viewBox="0 0 28 28" aria-hidden="true">
                    <rect width="28" height="28" fill="#111111"/>
                    <circle cx="19" cy="9" r="5" fill="#d7261e"/>
                </svg>
                <div class="brand-text">
                    <strong>The Lottery</strong>
                    <small>Odds you were never going to beat</small>
                </div>
            </div>
            <div class="stats">
                <div class="stat"><span>Attempts</span><b id="stat-tries">0</b></div>
                <div class="stat"><span>Spent</span><b id="stat-spent">$0.00</b></div>
                <div class="stat"><span>Won back</span><b id="stat-won">$0.00</b></div>
                <div class="stat"><span>Net</span><b id="stat-net">$0.00</b></div>
                <button class="icon-btn" id="mute-btn" type="button">Sound on</button>
                <button class="icon-btn" id="reset-btn" type="button">Reset</button>
            </div>
        </header>

        <nav class="machines" id="machine-nav" aria-label="Machines">
            <div class="nav-title">Machines</div>
        </nav>

        <main class="stage" id="stage"></main>
    </div>
</body>
</html>
